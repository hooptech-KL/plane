name: Build All CE images (prod cutover)

on:
  push:
    branches: [hooptech]
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/build-all-ce.yml"
  workflow_dispatch:

concurrency:
  group: build-all-ce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            image: plane-web
            context: .
            file: ./apps/web/Dockerfile.web
          - name: space
            image: plane-space
            context: .
            file: ./apps/space/Dockerfile.space
          - name: admin
            image: plane-admin
            context: .
            file: ./apps/admin/Dockerfile.admin
          - name: live
            image: plane-live
            context: .
            file: ./apps/live/Dockerfile.live
          - name: backend
            image: plane-backend
            context: ./apps/api
            file: ./apps/api/Dockerfile.api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:ce
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:ce-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
