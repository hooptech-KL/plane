name: Build Custom Web v1 (inline video)
on:
  push:
    branches: [hooptech]
    paths: ["apps/web/**", "packages/**", ".github/workflows/build-web-v1.yml"]
  workflow_dispatch:
concurrency:
  group: build-web-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/plane-web:inline-video-v1
            ghcr.io/${{ steps.owner.outputs.name }}/plane-web:v1-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
