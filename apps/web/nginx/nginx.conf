worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forward-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  access_log /dev/stdout;
  error_log /dev/stderr;

  map $http_user_agent $plane_link_preview_bot {
    default 0;
    "~*(?:slackbot|discordbot|whatsapp|facebookexternalhit|twitterbot|telegrambot|linkedinbot|skypeuripreview|embedly|redditbot|mattermost|rocket\.?chat|iframely|zoho)" 1;
  }

  server {
    listen 3000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location ~ "^/(?<preview_ws>[A-Za-z0-9_-]+)/browse/(?<preview_key>[A-Za-z0-9]+-[0-9]+)/?$" {
      root   /usr/share/nginx/html;
      default_type text/html;
      if ($plane_link_preview_bot) {
        return 200 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>$preview_key</title><meta name="description" content="Work item in Plane"/><meta property="og:type" content="article"/><meta property="og:site_name" content="Plane"/><meta property="og:title" content="$preview_key"/><meta property="og:description" content="Work item in Plane"/><meta property="og:url" content="https://$host$request_uri"/><meta name="twitter:card" content="summary"/><meta name="twitter:title" content="$preview_key"/><meta name="twitter:description" content="Work item in Plane"/></head><body>$preview_key</body></html>';
      }
      try_files $uri $uri/ /index.html;
    }

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }
  }
}

